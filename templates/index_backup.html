<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bartender Sam</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 50px 20px;
            background: #1c1c1c;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            color: #bbb;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: white;
            color: #111;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .section {
            padding: 40px 20px;
        }

        .card {
            background: #1c1c1c;
            padding: 25px;
            margin: 15px auto;
            border-radius: 15px;
            max-width: 400px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bartender Sam</h1>
        <p>Cocktails, bar knowledge and hospitality</p>

        <a href="#about" class="button">Explore</a>
    </header>

    <section class="section" id="about">

        <div class="card">
            <h2>🍸 Cocktails</h2>
            <p>Discover classic and signature cocktails.</p>
        </div>

        <div class="card">
            <h2>🍋 Bar Knowledge</h2>
            <p>Learn about spirits, ingredients, tools and techniques.</p>
        </div>

        <div class="card">
            <h2>🔥 Bartender Sam</h2>
            <p>A bartender building his skills, one drink at a time.</p>
        </div>

    </section>

</body>
</html>
